name: namo-tests

# The layers that decide whether a film is worth rendering: the writer that measures every
# line, and the paper gate that refuses a frame the compositor never painted.
on:
  workflow_dispatch:
  push:
    paths:
      - 'namo/**.py'
      - 'tests/test_writer.py'
      - 'tests/test_gates.py'
      - 'tests/test_paper_gate.py'
      - '.github/workflows/namo-tests.yml'

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: ffmpeg
        run: |
          set -eu
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
      - name: writer (no ffmpeg needed)
        run: python3 tests/test_writer.py
      - name: gates (skill rules + A/V sync)
        run: python3 tests/test_gates.py
      - name: paper gate
        run: python3 tests/test_paper_gate.py
