name: namo-studio
# One workflow, three pipelines. The engine is bootstrapped once, then any pipeline can run.
on:
  workflow_dispatch:
    inputs:
      pipeline: {description: "namo-webshow | namo-explainer | namo-customer", required: true, default: "namo-webshow"}
      ep:       {description: "episode or job id", required: true, default: "ep01"}
      brief:    {description: "one-line brief (explainer/customer)", required: false, default: ""}
jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}

      - name: system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg chromium-browser || sudo apt-get install -y -qq chromium
          echo "PLAYWRIGHT_CHROME=$(command -v chromium || command -v chromium-browser)" >> $GITHUB_ENV

      - name: cache engines
        uses: actions/cache@v4
        with:
          path: |
            ftm
            lemo
            .venv
          key: namo-engines-v1-${{ hashFiles('namo/bootstrap.sh') }}

      - name: bootstrap
        run: bash namo/bootstrap.sh

      - name: engine probe
        run: python3 namo/engine.py runtimes --probe

      - name: corpus (DCS, CC-BY 4.0)
        run: |
          mkdir -p corpus
          curl -fsSL -o corpus/mahabharatam.txt https://raw.githubusercontent.com/ambuda-org/dcs/master/mahabharatam.txt || echo "corpus fetch failed (webshow still works from show/)"
          wc -c corpus/mahabharatam.txt || true

      - name: factory gate
        run: python3 namo/namo_check.py || echo "gate warned"

      - name: render mg scene
        env:
          EP: ${{ github.event.inputs.ep }}
        run: |
          cat > /tmp/job.json <<EOF
          {"scene":"gita-$EP","fps":24,"workers":4,"name":"mg-$EP"}
          EOF
          python3 namo/engine.py render mg /tmp/job.json out || echo "mg render did not pass the guard"

      - name: compose film
        env:
          EP: ${{ inputs.ep }}
          PATH: ${{ env.PATH }}:${{ github.workspace }}/../piper
        run: python3 namo/namo_studio.py || echo "compose skipped"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-${{ github.event.inputs.ep }}
          path: |
            out/
            render/films/**
          retention-days: 14

      - name: publish to R2
        if: success() && env.R2_AK != ''
        env:
          R2_AK: ${{ secrets.R2_AK }}
          R2_SK: ${{ secrets.R2_SK }}
          R2_EP: ${{ secrets.R2_EP }}
          EP: ${{ github.event.inputs.ep }}
        run: |
          pip install -q boto3
          python - <<'PY'
          import os, boto3, glob
          s3 = boto3.client("s3", endpoint_url=os.environ["R2_EP"],
                            aws_access_key_id=os.environ["R2_AK"],
                            aws_secret_access_key=os.environ["R2_SK"], region_name="auto")
          ep = os.environ.get("EP","ep01")
          for f in glob.glob("out/*.mp4") + glob.glob("render/films/**/*.mp4", recursive=True):
              k = "render/studio/%s/%s" % (ep, os.path.basename(f))
              s3.upload_file(f, "namo-media", k, ExtraArgs={"ContentType":"video/mp4"})
              print("uploaded", k)
          PY
