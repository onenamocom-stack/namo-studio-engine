name: debug-render
on: {workflow_dispatch: {}}
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: deps
        run: |
          echo "ffmpeg: $(command -v ffmpeg || echo MISSING)"
          echo "chrome: $(command -v google-chrome || echo MISSING)"
          echo "PLAYWRIGHT_CHROME=$(command -v google-chrome)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: |
            lemo
            ftm
            .venv
          key: namo-engines-v3-${{ hashFiles('namo/bootstrap.sh') }}
      - name: bootstrap
        run: bash namo/bootstrap.sh
      - name: what is where
        run: |
          echo "--- node ---"; node --version
          echo "--- lemo ---"; ls lemo/core/render/ | head
          echo "--- scene ---"; ls namo/mg/scenes/gita-ep01/
          echo "--- fonts ---"; ls lemo/styles/ink-wash/demo/fonts/ 2>/dev/null | head
          echo "--- run the exact command, scene copied as the engine does ---"
          T=$(mktemp -d); mkdir -p $T/films
          cp -r namo/mg/scenes/gita-ep01 $T/films/gita-ep01
          cp namo/mg/fonts.css $T/films/gita-ep01/ 2>/dev/null || echo "(no namo/mg/fonts.css)"
          ls $T/films/gita-ep01
          echo "--- node, absolute out ---"
          node lemo/core/render/video.mjs films/gita-ep01 --fps 24 --workers 2 --out $T/out.mp4 2>&1 | tail -30 || true
          echo "rc=$?"
          ls -la $T/out.mp4 2>/dev/null || echo "NO OUTPUT FILE"
