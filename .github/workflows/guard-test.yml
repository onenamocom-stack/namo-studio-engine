name: guard-test

# Proves namo/engine.py::verify_video rejects a film that is not the film asked for.
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/guard_test.py'
      - 'namo/engine.py'
      - '.github/workflows/guard-test.yml'

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: ffmpeg
        run: |
          set -eu
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: synthetic fixtures through the intent check
        run: |
          set -eu
          python3 tools/guard_test.py
