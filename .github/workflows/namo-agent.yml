name: namo-agent
# One prompt in, one video out. This is the only entry point a human needs.
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "what video do you want? (one line is enough)"
        required: true
        default: "make a 30 second explainer about how Jev mode works"
      seconds: {description: "override length", required: false, default: ""}
      ratio:   {description: "16:9 | 9:16 | 1:1", required: false, default: ""}
      dry:     {description: "1 = print the plan, render nothing", required: false, default: ""}

permissions:
  contents: read
  id-token: write   # Workload Identity Federation -> Google Cloud TTS (chirp3 voices)

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: namo/rd/package-lock.json}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}

      # apt-get install ffmpeg once hung 36 min on a runner; a static build is seconds and cached.
      - uses: FedericoCarboni/setup-ffmpeg@v3

      # chirp3 voices: engine.py takes a token from `gcloud auth print-access-token`
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/499026166575/locations/global/workloadIdentityPools/github/providers/namo-studio-engine
          service_account: namo-tts-ci@project-5e5df107-b8f8-4649-9d1.iam.gserviceaccount.com   # Cloud TTS only; never the deploy SA

      - uses: google-github-actions/setup-gcloud@v2

      - name: chrome
        # the runner image already carries Google Chrome — an apt install of chromium
        # drags in snap and costs ~5 minutes on every single run. Use what is there.
        run: |
          CH=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          echo "PLAYWRIGHT_CHROME=$CH" >> $GITHUB_ENV
          echo "using chrome: $CH"
          "$CH" --version || true

      - name: cache engines
        uses: actions/cache@v4
        with:
          path: |
            ftm
            lemo
            .venv
          key: namo-engines-v3-${{ hashFiles('namo/bootstrap.sh') }}

      - name: bootstrap
        run: bash namo/bootstrap.sh

      # rd runtime (explainers): as factory.yml - rendiv deps + playwright's chromium, cached per lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('namo/rd/package-lock.json') }}

      - name: rd deps (rendiv)
        working-directory: namo/rd
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      # piper voices, as factory.yml (a brief may name a piper voice)
      - uses: actions/cache@v4
        with:
          path: .voices
          key: piper-voices-v1-hi_IN-pratham-medium-en_US-lessac-medium

      - name: voice (piper)
        run: |
          python3 -m pip install -q piper-tts==1.3.0
          python3 -m piper.download_voices --data-dir .voices hi_IN-pratham-medium en_US-lessac-medium

      - name: engine probe
        # as factory.yml: one runtime may FAIL on CI; none registered = nothing can render
        run: |
          python3 namo/engine.py probe | tee probe.txt
          if grep -q '^REGISTRY: empty' probe.txt; then echo "::error::probe: no runtime registered"; exit 1; fi

      - name: decide
        id: decide
        # overrides are structured fields (agent.py --json), never prose appended to the prompt:
        # "... 30 second ..." + " 60 seconds" still parsed as 30 (the first duration wins)
        env:
          P: ${{ github.event.inputs.prompt }}
          S: ${{ github.event.inputs.seconds }}
          R: ${{ github.event.inputs.ratio }}
        run: |
          python3 - <<'PY'
          import json, os
          b = {"prompt": os.environ["P"]}
          if os.environ["S"]: b["seconds"] = int(os.environ["S"])
          if os.environ["R"]: b["ratio"] = os.environ["R"]
          json.dump(b, open("brief.json", "w"))
          print(json.dumps(b))
          PY
          set -o pipefail
          python3 namo/agent.py --dry --json brief.json | tee out_plan.json

      - name: make the video
        if: github.event.inputs.dry != '1'
        run: python3 namo/agent.py --json brief.json     # a refused or rejected film fails the run, so R2 never gets it

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-output
          path: |
            out/
            out_plan.json
            brief.json

      - name: publish to R2
        if: success() && inputs.dry != '1'
        env:
          R2_AK: ${{ secrets.R2_AK }}
          R2_SK: ${{ secrets.R2_SK }}
          R2_EP: ${{ secrets.R2_EP }}
        run: |
          [ -z "$R2_AK" ] && { echo "no R2 secrets; artifact only"; exit 0; }
          pip install -q boto3
          python - <<'PY'
          import os, boto3, glob, json
          s3 = boto3.client("s3", endpoint_url=os.environ["R2_EP"],
                            aws_access_key_id=os.environ["R2_AK"],
                            aws_secret_access_key=os.environ["R2_SK"], region_name="auto")
          plan = {}
          try: plan = json.load(open("out/plan.json"))
          except Exception: pass
          tag = plan.get("kind","video")
          for f in glob.glob("out/*.mp4"):
              k = "agent/%s/%s" % (tag, os.path.basename(f))
              s3.upload_file(f, "namo-media", k, ExtraArgs={"ContentType":"video/mp4"})
              print("uploaded", k)
          PY
