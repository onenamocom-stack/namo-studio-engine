name: factory
# The factory runs itself: reads queue.json, plans, checks feasibility, renders, verifies,
# writes status.json back. Every step reports; a failure does not hide behind `|| true`.
on:
  workflow_dispatch:
    inputs:
      dry: {description: "1 = plan only, render nothing", required: false, default: ""}
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write
  id-token: write   # Workload Identity Federation -> Google Cloud TTS (chirp3 voices)

concurrency:
  group: factory
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: namo/rd/package-lock.json}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}

      # static ffmpeg+ffprobe, cached; `apt-get install ffmpeg` took 36 min on run 42107269065
      - uses: FedericoCarboni/setup-ffmpeg@v3

      - name: chrome
        run: |
          CH=$(command -v google-chrome || command -v google-chrome-stable || true)
          echo "PLAYWRIGHT_CHROME=$CH" >> $GITHUB_ENV
          echo "chrome: $CH"

      # chirp3 voices: engine.py takes a token from `gcloud auth print-access-token`
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/499026166575/locations/global/workloadIdentityPools/github/providers/namo-studio-engine
          service_account: namo-tts-ci@project-5e5df107-b8f8-4649-9d1.iam.gserviceaccount.com   # Cloud TTS only; never the deploy SA

      - uses: google-github-actions/setup-gcloud@v2

      - uses: actions/cache@v4
        with:
          path: |
            lemo
            ftm
            .venv
          key: namo-engines-v3-${{ hashFiles('namo/bootstrap.sh') }}

      - name: bootstrap engines
        run: bash namo/bootstrap.sh

      # rd runtime: rendiv (React) explainers; playwright's own chromium, cached per lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('namo/rd/package-lock.json') }}

      - name: rd deps (rendiv)
        working-directory: namo/rd
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      # voice (piper engine): piper runs under the same python3 as namo/engine.py (not .venv), so it
      # is installed there. Models are cached; engine.voice_model() fetches any other id on demand.
      - uses: actions/cache@v4
        with:
          path: .voices
          key: piper-voices-v1-hi_IN-pratham-medium-en_US-lessac-medium

      - name: voice (piper)
        run: |
          python3 -m pip install -q piper-tts==1.3.0
          python3 -m piper.download_voices --data-dir .voices hi_IN-pratham-medium en_US-lessac-medium
          ls -la .voices

      - name: probe
        run: python3 namo/engine.py probe || true

      - name: pipeline gate (P1)
        run: |
          fail=0
          for y in pipeline_defs/namo-*.yaml; do
            python3 namo/engine.py pipeline "$y" || fail=1
          done
          echo "P1 gate: $([ $fail -eq 0 ] && echo pass || echo 'open drift (D1-D3)')"

      - name: run the factory
        run: python3 namo/factory.py --once ${{ inputs.dry == '1' && '--dry' || '' }}

      - name: factory status
        if: always()
        run: cat status.json || echo "no status.json written"

      - name: write status back
        if: always()
        run: |
          git config user.name  "namo-factory"
          git config user.email "factory@namo.invalid"
          mkdir -p status_history
          cp status.json status_history/$(date -u +%Y%m%dT%H%M%SZ).json 2>/dev/null || true
          git add status.json status_history 2>/dev/null || true
          git diff --staged --quiet || git commit -m "factory: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push || echo "push skipped"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: factory-out
          path: |
            out/
            status.json
          retention-days: 14
