name: factory
# The factory runs itself. Every 6 hours it wakes, reads queue.json, makes what it can,
# verifies the pixels, writes status.json back, and goes back to sleep.
# It uses exactly one GPU pod per run at most, and only if a GPU job is actually queued.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      dry: {description: "1 = plan only", required: false, default: ""}

permissions:
  contents: write          # the factory writes status.json back to the repo

concurrency:
  group: factory
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}

      - name: system deps
        run: |
          sudo apt-get install -y -qq ffmpeg
          CH=$(command -v google-chrome || command -v chromium || true)
          echo "PLAYWRIGHT_CHROME=$CH" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          path: |
            ftm
            lemo
            .venv
          key: namo-engines-v2-${{ hashFiles('namo/bootstrap.sh') }}

      - name: bootstrap
        run: bash namo/bootstrap.sh

      - name: drift gate
        run: |
          python3 namo/drift.py || echo "::warning::drift present — see SPEC.md; factory continues but records it"

      - name: run the factory
        env:
          RUNPOD_KEY: ${{ secrets.RUNPOD_KEY }}
        run: python3 namo/factory.py --once ${{ inputs.dry == '1' && '--dry' || '' }}

      - name: write status back
        if: always()
        run: |
          git config user.name  "namo-factory"
          git config user.email "factory@namo.invalid"
          cp status.json status_history/$(date -u +%Y%m%dT%H%M%SZ).json 2>/dev/null || {
            mkdir -p status_history && cp status.json status_history/$(date -u +%Y%m%dT%H%M%SZ).json; }
          git add status.json status_history || true
          git diff --staged --quiet || git commit -m "factory: $(date -u +%Y-%m-%dT%H:%MZ) $(python3 -c "import json;d=json.load(open('status.json'));print(len(d['runs']),'runs')" 2>/dev/null)"
          git push || echo "push skipped"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: factory-out
          path: |
            out/
            status.json
          retention-days: 14
