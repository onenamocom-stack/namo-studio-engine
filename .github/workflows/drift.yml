name: drift
# The goldfish. Runs on every push and fails when the repository stops matching SPEC.md.
on:
  push:
  workflow_dispatch:
jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: check the repo against SPEC.md
        run: python3 namo/drift.py
