name: rendiv-test
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: bash scripts/rendiv-test.sh 2>&1 | tee rd.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: rendiv-log, path: rd.log}
