<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>NAMO · factory monitor</title>
<style>
:root{--bg:#0b0e14;--panel:#0d1117;--line:#21262d;--fg:#e6edf3;--dim:#7d8590;--ok:#3fb950;--bad:#f85149;--warn:#d29922;--accent:#7c3aed}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 ui-sans-serif,-apple-system,system-ui,sans-serif}
header{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);z-index:9}
h1{font-size:14px;margin:0;font-weight:650;letter-spacing:.06em}
.pill{padding:3px 9px;border:1px solid var(--line);border-radius:99px;font-size:11px;color:var(--dim)}
.dot{width:7px;height:7px;border-radius:99px;display:inline-block;margin-right:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line)}
.cell{background:var(--bg);padding:14px 20px}
.k{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.07em}
.v{font-size:21px;margin-top:3px;font-variant-numeric:tabular-nums}
main{padding:18px 20px 60px;max-width:1100px}
h2{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);margin:26px 0 10px;font-weight:600}
.run{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.id{font-weight:600;font-family:ui-monospace,monospace;font-size:13px}
.brief{color:var(--dim);font-size:12.5px;margin:6px 0 10px;overflow-wrap:anywhere}
.plan{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tag{background:#161b22;border:1px solid var(--line);border-radius:5px;padding:2px 7px;font-size:11px;font-family:ui-monospace,monospace;color:#9fb0c0}
.why{font-size:12.5px;padding:8px 10px;border-radius:6px;background:#161b22;border-left:3px solid var(--warn);overflow-wrap:anywhere}
.why.bad{border-left-color:var(--bad)}.why.ok{border-left-color:var(--ok)}
.state{font-size:11px;font-weight:700;letter-spacing:.06em;padding:3px 9px;border-radius:5px}
.DONE{background:rgba(63,185,80,.15);color:var(--ok)}
.BLOCKED{background:rgba(210,153,34,.15);color:var(--warn)}
.FAILED,.CRASHED{background:rgba(248,81,73,.15);color:var(--bad)}
.RUNNING,.DRY{background:rgba(124,58,237,.18);color:#a78bfa}
a{color:#58a6ff;text-decoration:none}a:hover{text-decoration:underline}
.empty{color:var(--dim);padding:24px;text-align:center;border:1px dashed var(--line);border-radius:10px}
.foot{color:var(--dim);font-size:11.5px;margin-top:24px;line-height:1.8}
</style>
<header>
 <h1>NAMO · FACTORY</h1>
 <span class="pill"><span class="dot" id=d></span><span id=state>connecting…</span></span>
 <span class="pill" id=repo>namo-studio-engine</span>
 <span class="pill" style="margin-left:auto" id=ts>—</span>
</header>
<div class="grid" id=stats></div>
<main>
 <h2>queue</h2><div id=queue></div>
 <h2>runs</h2><div id=runs></div>
 <h2>workflows</h2><div id=wfs></div>
 <div class="foot">
  factory = <code>namo/factory.py</code> · engine = <code>namo/engine.py</code> ·
  review = <code>namo/jev.py</code> · contract = <code>SPEC.md</code><br>
  <span id=src>source: status.json</span>
 </div>
</main>
<script>
const REPO='onenamocom-stack/namo-studio-engine';
const RAW='https://raw.githubusercontent.com/'+REPO+'/main/';
const API='https://api.github.com/repos/'+REPO+'/actions/runs?per_page=6';
const esc=s=>String(s??'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
function box(k,v){return `<div class=cell><div class=k>${k}</div><div class=v>${v}</div></div>`}
async function j(u){const r=await fetch(u+'?'+Date.now());if(!r.ok)throw new Error(r.status);return r.json()}
async function txt(u){const r=await fetch(u+'?'+Date.now());return r.ok?r.text():''}
async function tick(){
 let st={runs:[]},q={jobs:[]};
 try{st=JSON.parse(await txt(RAW+'status.json'))}catch(e){}
 try{q=JSON.parse(await txt(RAW+'queue.json'))}catch(e){}
 const runs=st.runs||[];
 const last=runs[runs.length-1];
 const done=runs.filter(r=>r.state==='DONE').length;
 const blocked=runs.filter(r=>r.state==='BLOCKED').length;
 const failed=runs.filter(r=>r.state==='FAILED'||r.state==='CRASHED').length;
 document.getElementById('stats').innerHTML=
   box('total runs',runs.length)+box('done',`<span style="color:var(--ok)">${done}</span>`)+
   box('blocked',`<span style="color:var(--warn)">${blocked}</span>`)+
   box('failed',`<span style="color:var(--bad)">${failed}</span>`)+
   box('queue',(q.jobs||[]).length);
 document.getElementById('queue').innerHTML=(q.jobs||[]).map(x=>
   `<div class=run><div class=row><span class=id>${esc(x.id)}</span></div><div class=brief>${esc(x.prompt)}</div></div>`
  ).join('')||'<div class=empty>queue empty</div>';
 document.getElementById('runs').innerHTML=runs.slice().reverse().map(r=>{
  const p=r.plan||{};
  const plan=Object.entries(p).map(([k,v])=>`<span class=tag>${k}=${esc(v)}</span>`).join('');
  const why=r.reason||r.guard||r.out||'';
  const cls=r.state==='DONE'?'ok':(r.state==='BLOCKED'?'':'bad');
  return `<div class=run><div class=row><span class=id>${esc(r.id)}</span><span class="state ${esc(r.state)}">${esc(r.state)}</span></div>
   <div class=brief>${esc(r.brief||'')}</div><div class=plan>${plan}</div>
   ${why?`<div class="why ${cls}">${esc(why)}</div>`:''}</div>`}).join('')||'<div class=empty>no runs yet — dispatch the factory workflow</div>';
 document.getElementById('ts').textContent=new Date().toLocaleTimeString();
 document.getElementById('state').textContent='live';
 document.getElementById('d').style.background='var(--ok)';
}
async function wf(){
 try{
  const d=await j(API);
  document.getElementById('wfs').innerHTML=(d.workflow_runs||[]).map(w=>{
   const c=w.conclusion||w.status;
   const col=c==='success'?'var(--ok)':(c==='failure'?'var(--bad)':'var(--warn)');
   return `<div class=run><div class=row><span class=id>${esc(w.name)}</span>
    <span style="color:${col};font-size:11.5px">${esc(c)}</span></div>
    <div class=brief>${esc(w.created_at.replace('T',' ').slice(0,16))} · <a href="${w.html_url}" target=_blank>open run ↗</a></div></div>`
  }).join('');
 }catch(e){document.getElementById('wfs').innerHTML='<div class=empty>github api rate-limited or offline — status.json still live</div>'}
}
tick(); wf(); setInterval(tick,5000); setInterval(wf,30000);
</script>
